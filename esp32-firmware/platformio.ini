; PirateBox hardware/sensor supervisor firmware - PlatformIO project.
;
; WHY PLATFORMIO + ARDUINO FRAMEWORK (not raw ESP-IDF, not Arduino IDE):
; see docs/ESP32-SUPERVISOR-DESIGN.md ("Firmware toolchain choice") for
; the full reasoning. Short version: PlatformIO gives a fully scripted,
; reproducible, non-interactive build+flash from this same Debian/Pi
; environment (no GUI, no manual board-manager clicking), pins exact
; platform/framework/library versions in this one file (checked into
; git, so a future maintainer gets the SAME toolchain, not whatever
; happens to be current), and the Arduino framework gives immediate
; access to a mature, well-documented ESP32-S3 peripheral API
; (temperatureRead(), esp_task_wdt, esp_reset_reason(), Serial/UART)
; without hand-writing ESP-IDF component boilerplate for a firmware
; this small. Raw ESP-IDF remains available later if a specific need
; (e.g. very fine-grained power control) outgrows Arduino's API.
;
; PINNED VERSIONS (deliberately exact, not "latest") - a future
; `pio run` on a fresh checkout reproduces this exact toolchain:
[env:esp32-s3-supervisor]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; This module is an N16R8 (16MB flash / 8MB PSRAM, confirmed read-only
; via esptool - docs/OPERATIONAL-DECISIONS.md, 2026-09-07). PSRAM is
; DELIBERATELY NOT enabled below - see docs/ESP32-SUPERVISOR-DESIGN.md
; ("PSRAM: confirmed present, deliberately not yet enabled") for why:
; this firmware doesn't need the extra RAM yet, and the WROOM-1 R8
; module's PSRAM bus width (quad vs octal) has not been independently
; confirmed for this exact unit - enabling the wrong mode risks a boot
; failure for no present benefit. Flash size IS set correctly below,
; since that was directly confirmed (GigaDevice 0x4018, 16MB detected).
board_upload.flash_size = 16MB
board_build.partitions = default.csv

; COM port only (docs/ESP32-SUPERVISOR-DESIGN.md §4 and docs/OPERATIONAL-
; DECISIONS.md - the native "USB" port's generic factory app firmware
; does not support esptool's automatic reset; the "COM" port's WCH
; CH9102 UART bridge does). ARDUINO_USB_MODE=1 + CDC_ON_BOOT=0 makes
; Arduino's `Serial` object the physical UART0 pins wired to that
; bridge (matching the COM port), NOT the chip's native USB-CDC
; peripheral - confirmed necessary on real hardware, see the design
; doc's "Which UART does Serial mean on this board" note.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPIRATEBOX_FW_VERSION=\"0.2.0\"
    -DPIRATEBOX_PROTOCOL_VERSION=1

monitor_speed = 115200
upload_speed = 460800

; ArduinoJson: small, well-maintained, no dynamic allocation surprises
; when used with StaticJsonDocument - a good fit for a memory-
; constrained, long-uptime supervisor that must never leak/fragment
; heap over weeks of operation.
;
; OneWire + DallasTemperature (2026-09-07, DS18B20 phase): the
; standard, mature pairing for DS18B20 on Arduino-family cores - ROM
; search/ CRC/scratchpad handling is exactly the kind of well-trodden,
; easy-to-get-subtly-wrong protocol logic not worth hand-rolling.
; DallasTemperature's async mode (setWaitForConversion(false)) is what
; lets ds18b20.cpp poll the bus without ever blocking the main loop -
; see that file's own header.
lib_deps =
    bblanchon/ArduinoJson @ 7.2.0
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
