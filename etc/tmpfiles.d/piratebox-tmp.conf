# PirateBox - Phase 4
#
# Declares /var/www/piratebox-tmp (PHP's disk-backed upload_tmp_dir - see
# pool.d/www.conf) so it exists with correct ownership after a fresh
# install or a reboot (tmpfiles.d "d" lines are applied at boot), and so
# systemd's existing periodic cleanup (systemd-tmpfiles-clean.timer, which
# ships enabled by default - no new timer/cron added here) removes any
# file left behind for more than a day.
#
# Under normal operation PHP deletes its own upload temp file at the end
# of every request (whether or not move_uploaded_file() was called), so
# nothing should ever actually accumulate here. This rule exists only to
# clean up the rare case of an abandoned file from a killed/crashed
# PHP-FPM worker (OOM kill, request_terminate_timeout, power loss)
# without needing a custom cron job.
#
# Type Path                        Mode UID      GID      Age
d      /var/www/piratebox-tmp      0700 www-data www-data 1d
