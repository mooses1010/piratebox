# PirateBox - Phase 4
#
# Declares /var/www/piratebox-tmp (PHP's disk-backed upload_tmp_dir - see
# pool.d/www.conf) so it exists with correct ownership after a fresh
# install or a reboot (tmpfiles.d "d" lines are applied at boot), and so
# systemd's existing periodic cleanup (systemd-tmpfiles-clean.timer, which
# ships enabled by default - no new timer/cron added here) removes any
# file left behind for more than a day.
#
# Under normal operation PHP deletes its own upload temp file at the end
# of every request (whether or not move_uploaded_file() was called), so
# nothing should ever actually accumulate here. This rule exists only to
# clean up the rare case of an abandoned file from a killed/crashed
# PHP-FPM worker (OOM kill, request_terminate_timeout, power loss)
# without needing a custom cron job.
#
# Type Path                        Mode UID      GID      Age
d      /var/www/piratebox-tmp      0700 www-data www-data 1d

# Added 2026-09-04 (Silly Mode round). /tmp/piratebox is where the
# Normal/Emergency mode toggle (set_piratebox_mode.sh) and the Silly
# Mode toggle (piratebox-silly) both live - tmpfs, so it's gone every
# reboot like the rest of /tmp, and set_piratebox_mode.sh's own
# `mkdir -p`/`chmod` already re-create it as a no-op if this rule beat
# it there. The real reason this line exists: piratebox-oled.service
# runs with PrivateTmp=yes and now has `BindReadOnlyPaths=/tmp/
# piratebox:/tmp/piratebox` to see into this directory (see that
# service file's own comment) - BindReadOnlyPaths only mounts a source
# that already exists at the moment the service starts, so this
# directory must be guaranteed to exist before piratebox-oled.service
# does. systemd-tmpfiles-setup.service runs during early boot (pulled
# in by sysinit.target, which every service without
# DefaultDependencies=no - including piratebox-oled.service - is
# already ordered after by systemd's own defaults), so this rule
# reliably wins the race with no extra After= line needed.
#
# The silly-mode toggle file itself is pre-created too (type "f": only
# if missing, never truncates an existing value) so a fresh boot always
# starts in a known, honest "off" state without depending on the
# CLI having ever run - matching MODE_FILE's own "missing = safe
# default" discipline. Owned by `moose` (the `piratebox-silly` CLI's
# own account, unprivileged, no sudo grant needed) - this is a cosmetic
# desk-toy toggle, not trusted operational state like Normal/Emergency
# Mode, so it deliberately does NOT go through set_piratebox_mode.sh's
# root-only path.
#
# Group changed to `gpio` and mode to 0664 (2026-09-04, "double-tap
# Silly toggle" round): `piratebox-button.service` runs with
# `Group=gpio` (see that unit file), so a double-tap can now write this
# SAME file directly - the exact state `piratebox-silly on`/`off`
# already control, deliberately not a second parallel toggle mechanism.
# `moose` keeps write access via the owner bit (unchanged); "other"
# still only gets read (mode 0664's last digit is unchanged from
# 0644's) - this narrowly adds group-write, nothing else.
d      /tmp/piratebox              0755 root     root     -
f      /tmp/piratebox/silly        0664 moose    gpio     - off

# Added 2026-09-04 (Progression round). Two more moose-owned, pre-
# created-empty request files in the same already-bound /tmp/piratebox
# directory, for the same reason `silly` above needs to be pre-created:
# `piratebox-silly` (unprivileged) can overwrite an EXISTING file it
# owns without needing write permission on the (root-owned) parent
# directory, but it cannot CREATE a new one there - so these two must
# already exist. `progression-reset-request`: written (then deleted
# moments later by the CLI itself, operating on the real host path, not
# through the daemon's read-only bind) to ask the OLED daemon to wipe
# Progression's persistent state - see piratebox-silly's own "reset"
# subcommand and piratebox_progression.py's header for the single-
# writer design this enables. `progression-import-request`: same
# pattern, staging a candidate progression.json for the daemon to
# validate and adopt (or reject) via "piratebox-silly import".
f      /tmp/piratebox/progression-reset-request   0644 moose moose -
f      /tmp/piratebox/progression-import-request  0644 moose moose -

# Added 2026-09-04 (Progression round). Durable, reboot-surviving home
# for piratebox_progression.py's own state (XP/levels/achievements/
# history) - deliberately NOT /tmp (tmpfs, wiped every reboot - the
# opposite of what "months/years of real use" needs). Owned by the same
# piratebox-gpio account the OLED daemon already runs as; group `gpio`
# (which `moose` is already a member of, per docs/HARDWARE-INTEGRATION-
# DESIGN.md §8) so `piratebox-silly stats`/`backup` can read the live
# file directly with no daemon round-trip - reads can never corrupt
# anything, only writes need the single-writer discipline above. Mode
# 0750 on the directory (no "other" access at all) plus 0640 on the
# data file itself (set by piratebox_progression.py's own atomic
# writer, not by this rule) keeps this off-limits to any other
# unprivileged account on the system.
d      /var/lib/piratebox-oled     0750 piratebox-gpio gpio -

# Added 2026-09-04 (OLED cadence rebalance round). Short-press "show me
# real stats" signal - a plain Unix timestamp, written by piratebox_
# button_daemon.py's on_released() (see that file's own comment) and
# read by piratebox_oled_daemon.py via its existing BindReadOnlyPaths=
# /tmp/piratebox bind (this file lives in the same directory, so no
# change was needed there). Owned by piratebox-gpio - the SAME account
# both the button and OLED daemons already run as - so the button
# daemon can overwrite this pre-existing file's content via its own
# new single-file `BindPaths=` (read-write) without needing write
# access to the (root-owned) parent directory, the identical pattern
# already used for Silly Mode's own toggle file.
f      /tmp/piratebox/status-check-request  0644 piratebox-gpio piratebox-gpio -

# Added 2026-09-04 (double-tap Silly toggle round). A double tap writes
# the ACTUAL toggle directly to /tmp/piratebox/silly (see that file's
# own updated comment above) - this second signal is purely cosmetic:
# a plain timestamp so the OLED daemon can show a one-shot "SILLY MODE
# ON/OFF" confirmation, edge-detected the same way Progression's own
# reset/import requests are (an in-memory "last seen mtime," never
# persisted). The OLED daemon reads the ACTUAL new state fresh from
# /tmp/piratebox/silly itself when it shows the confirmation - this
# file only ever says "something changed just now," never what it
# changed to, so there is exactly one source of truth for the state
# itself.
f      /tmp/piratebox/silly-toggle-request  0644 piratebox-gpio piratebox-gpio -

# Added 2026-09-04 (Expression Engine v2 round). Pre-created-empty
# request file for `piratebox-silly preview` - same reason `silly`
# and the two progression-*-request files above need to be pre-
# created: the unprivileged CLI (running as `moose`, no sudo grant for
# this) can overwrite an EXISTING file it owns without needing write
# permission on the (root-owned) parent directory, but cannot CREATE a
# new one there. Owned by `moose` (the CLI's own account, same as the
# progression-*-request files), NOT piratebox-gpio - unlike `silly`
# and `silly-toggle-request` above, nothing on the button-daemon side
# ever writes this one. Read by the OLED daemon via its existing
# BindReadOnlyPaths=/tmp/piratebox:/tmp/piratebox bind - no service
# file change needed for this addition.
f      /tmp/piratebox/silly-preview-request  0644 moose moose -

# Added 2026-09-04 (Distance/Glance Display round). Same exact pattern
# as `silly-preview-request` just above, for `piratebox-silly
# glance-preview` - a separate, independent request file rather than
# reusing that one, since a glance-page preview must work regardless
# of whether Silly Mode happens to be on or off (glance pages are not
# Silly content). Owned by `moose` for the same reason: nothing on the
# button-daemon/piratebox-gpio side ever writes this one either. Read
# by the OLED daemon via its existing BindReadOnlyPaths=/tmp/piratebox:
# /tmp/piratebox bind - no service file change needed for this
# addition, same as every other addition to this directory so far.
f      /tmp/piratebox/glance-preview-request  0644 moose moose -
