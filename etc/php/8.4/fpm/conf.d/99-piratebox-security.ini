; PirateBox PHP security hardening - defense in depth
; ---------------------------------------------------
; Installed to /etc/php/8.4/fpm/conf.d/99-piratebox-security.ini
; by tools/apply_php_security_update.sh.
;
; WHY A conf.d DROP-IN AND NOT AN EDIT TO php.ini: /etc/php/8.4/fpm/
; php.ini is ucf-managed (registered to php8.4-fpm in
; /var/lib/ucf/registry) and already carries PirateBox's own local
; edits (open_basedir, the 120M upload sizing, memory_limit 256M).
; Every additional local edit to that file widens the ucf conflict a
; future php8.4 security update has to resolve. A separate file in
; conf.d is owned by no package, so a package upgrade can neither
; prompt about it nor revert it, and it is read after php.ini - so it
; wins without touching the ucf-tracked file at all.
;
; session.upload_progress.enabled=0
; ---------------------------------
; Mitigation for CVE-2026-109619 (php2shell - heap use-after-free in
; PHP's session upload-progress handling, unauthenticated RCE, CVSS
; v4.0 9.2; see also CVE-2026-109618). The upstream fix is PHP
; 8.4.27 / Debian 8.4.27-1~deb13u1 (DSA-6574-1) and that package
; update - not this line - is the actual fix; PHP upstream is explicit
; that disabling the feature blocks the one confirmed session path but
; not other variants of the same bug class.
;
; This line is kept anyway, permanently, because it is free here:
; PirateBox does not use PHP's server-side upload-progress feature at
; all. public/upload.php reports progress from the browser via
; xhr.upload.onprogress (public/assets/scripts.js) - a client-side
; XMLHttpRequest event that never consults PHP's session store. There
; is no reference to PHP_SESSION_UPLOAD_PROGRESS, session.upload_
; progress, or any progress-polling endpoint anywhere in
; var/www/html/. So turning the feature off removes an
; internet-facing, pre-request-initialisation code path that fires on
; every multipart POST to every .php endpoint (nginx routes all of
; them to FPM) while costing exactly zero PirateBox functionality -
; the upload progress bar is unaffected.
;
; Do not "re-enable for upload progress": that would not restore
; anything, because nothing here ever read it.
session.upload_progress.enabled = 0
