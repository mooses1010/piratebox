# PirateBox: OpenWebRX+ reverse-proxy location, included from
# etc/nginx/sites-available/default's existing server block (kept as a
# separate file so this optional capability's nginx footprint stays a
# minimal, isolated, easy-to-review/revert diff against the existing
# captive-portal config, rather than growing that file in place).
#
# Investigated before writing this (see
# docs/RADIO-SDR-ARCHITECTURE-DESIGN.md's OpenWebRX+ integration
# section for the full evidence): OpenWebRX+'s own frontend JS
# constructs every asset URL and its WebSocket URL (owrx.js's
# open_websocket()) relative to window.location.href itself, not a
# hardcoded root path - it is genuinely subpath-reverse-proxy-safe by
# design, which is why "/radio/" (matching the architecture this
# project's own docs already called for) was chosen over a separate
# hostname/port, with no application-side patching needed.
#
# proxy_pass's trailing slash on the target URL is load-bearing: it
# strips the "/radio/" prefix before forwarding to OpenWebRX+, which
# only ever knows about paths rooted at "/" on its own loopback port -
# exactly matching how the browser-side JS above computes "/radio/..."
# relative to the page's own observed URL. Removing that trailing
# slash would silently double up the prefix and break every asset/
# websocket request.
#
# OpenWebRX+ binds to 127.0.0.1:8073 only (etc/openwebrx/openwebrx.conf)
# - this is nginx's only path to it; it is never directly reachable
# from pb-ap clients.
location = /radio {
    return 301 /radio/;
}

location ^~ /radio/ {
    proxy_pass http://127.0.0.1:8073/;

    # WebSocket upgrade - required for the waterfall/audio stream and
    # every tuning interaction; OpenWebRX+ is unusable without this.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The waterfall/audio WebSocket is long-lived by design (a visitor
    # may leave a receiver tuned in for a while) - nginx's normal
    # proxy timeouts (60s default) would otherwise silently drop an
    # idle-but-still-open connection out from under the browser.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
