#!/usr/sbin/nft -f

# PROVENANCE NOTE: this file already exists live at /etc/nftables.conf
# and has been in effect throughout this project's history (loaded at
# boot by nftables.service) - it was found live-only and UNTRACKED
# during the ALFA Migration Round (2026-09-03) and is being brought
# into version control here for the first time. Same category of gap
# as etc/NetworkManager/conf.d/99-piratebox.conf, found the same way
# during an earlier round.
#
# This also corrects a real error in docs/EXTERNAL-AP-ARCHITECTURE-
# DESIGN.md, which had claimed "no nftables/firewall configuration
# exists in this project at all" - that audit only searched the
# tracked repo and missed this live-only file entirely. See
# docs/OPERATIONAL-DECISIONS.md "ALFA Migration Round" for the full
# story of how this was found (while validating the actual migration,
# checking the "nftables still protects SSH from the wireless side"
# item on the operator's own validation checklist).

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter;
		# Reject SSH from anything except the trusted wired management
		# path (eth0) and loopback. Originally written as
		# `iifname "wlan0" tcp dport 22 reject ...` - correct while
		# wlan0 was the only-ever visitor radio, but silently stopped
		# protecting anything the moment production migrated to pb-ap
		# (ALFA Migration Round, 2026-09-03): wlan0 traffic no longer
		# exists, so the old rule never fired again, and pb-ap was never
		# covered by any rule at all. Rewritten as a denylist of the
		# trusted paths instead of an allowlist of "whichever radio is
		# active today", so it stays correct through any future radio
		# change (another migration, a repurposed onboard wlan0, a
		# different external adapter) with no rule update required -
		# the same "read real state, don't hardcode an interface name"
		# principle already applied elsewhere this round
		# (piratebox_status_helper.sh's auto-detection).
		iifname != { "eth0", "lo" } tcp dport 22 reject with tcp reset
	}
	chain forward {
		type filter hook forward priority filter;
	}
	chain output {
		type filter hook output priority filter;
	}
}
