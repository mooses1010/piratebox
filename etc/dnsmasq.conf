interface=wlan0
dhcp-range=10.0.0.10,10.0.0.250,12h
address=/#/10.0.0.1

# Post-Stage-32: makes the wildcard above fully deterministic for every
# name, including "piratebox" itself. Without this, dnsmasq answers
# from /etc/hosts BEFORE falling back to the address=/#/ wildcard - and
# this Pi's own hostname IS "piratebox" (/etc/hostname), with Debian's
# standard `127.0.1.1 piratebox` entry in /etc/hosts. Confirmed directly
# with a raw DNS query against the live resolver: without this line,
# querying "piratebox" returned 127.0.1.1 (meaningless off-Pi) instead
# of 10.0.0.1 - silently breaking the http://piratebox/ human-facing URL
# for every Wi-Fi client. no-hosts only changes what dnsmasq answers
# OTHER devices asking it about names in /etc/hosts (localhost included,
# which the wildcard now also correctly catches, consistent with every
# other name) - it does not touch DHCP leasing, option 114, or the
# Pi's own local hostname resolution (glibc resolves the Pi's own
# hostname via /etc/hosts directly, never by querying this dnsmasq
# instance). Re-verified in an isolated, throwaway dnsmasq instance on a
# private port before this was ever applied to the live config -
# wildcard behavior for every other name (including the
# connectivitycheck.gstatic.com-style captive-portal DNS-hijack targets)
# confirmed unchanged.
no-hosts

# RFC 8910 / RFC 7710bis: DHCP option 114 advertises the Captive Portal API
# URL (RFC 8908) to clients that support it (Android 11+, some others).
# dnsmasq 2.91 has no built-in name for option 114, so it's set numerically;
# the quoted value is sent as a raw ASCII URI string per RFC 8910 encoding.
# Endpoint is served by nginx at /.well-known/captive-portal (see
# etc/nginx/sites-available/default). Legacy HTTP-probe-based detection
# (generate_204, hotspot-detect.html, ncsi.txt, etc.) is left in place
# unchanged for clients that don't support the Capport API.
dhcp-option=114,"http://10.0.0.1/.well-known/captive-portal"
