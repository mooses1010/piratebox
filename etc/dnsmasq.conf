interface=wlan0
dhcp-range=10.0.0.10,10.0.0.250,12h
address=/#/10.0.0.1

# Host/management DNS isolation fix (2026-09-03 incident - see
# docs/OPERATIONAL-DECISIONS.md "Host/Management DNS Isolation Fix").
# `interface=` above restricts DHCP and the *intended* DNS scope to the
# visitor AP, but dnsmasq has a documented quirk: it always answers DNS
# queries that arrive via the loopback interface (127.0.0.1), REGARDLESS
# of `interface=`/`--interface` - lo is never subject to that filter
# unless explicitly excluded. Confirmed live with a raw DNS query
# straight at 127.0.0.1:53 (bypassing /etc/resolv.conf entirely): it
# answered "10.0.0.1" for claude.ai even with `interface=pb-ap` already
# in effect. This is exactly the mechanism that resolved the Pi's own
# hostname lookups to the captive wildcard once /etc/resolv.conf lost
# its real nameservers (see the dhcpcd `nohook resolv.conf` fix in
# etc/dhcpcd.conf for the other half of that chain) - glibc's resolver
# falls back to 127.0.0.1 when resolv.conf has no nameserver lines.
# except-interface=lo closes this off completely: dnsmasq no longer
# answers ANY query arriving via loopback, so the Pi's own host
# resolution can never silently land on the visitor wildcard again, no
# matter what state /etc/resolv.conf is in. This does not change what
# pb-ap clients receive - they never query dnsmasq over lo.
#
# bind-interfaces (literally binding only to pb-ap's own address,
# instead of dnsmasq's default dynamic wildcard-bind-with-packet-filter)
# was considered too, for defense in depth, but deliberately NOT applied
# here: past live validation during the ALFA migration logged dnsmasq's
# own "interface pb-ap does not currently exist" warning at the moment
# it started (the ALFA can enumerate after dnsmasq's own unit starts at
# boot) - the current dynamic-bind mode tolerates that as a non-fatal
# warning and keeps retrying, while bind-interfaces would need to bind()
# to that address immediately and could turn a slow-to-enumerate ALFA
# into a hard dnsmasq start failure. except-interface=lo alone already
# closes the actual vulnerability without that boot-ordering risk.
except-interface=lo

# Post-Stage-32: makes the wildcard above fully deterministic for every
# name, including "piratebox" itself. Without this, dnsmasq answers
# from /etc/hosts BEFORE falling back to the address=/#/ wildcard - and
# this Pi's own hostname IS "piratebox" (/etc/hostname), with Debian's
# standard `127.0.1.1 piratebox` entry in /etc/hosts. Confirmed directly
# with a raw DNS query against the live resolver: without this line,
# querying "piratebox" returned 127.0.1.1 (meaningless off-Pi) instead
# of 10.0.0.1 - silently breaking the http://piratebox/ human-facing URL
# for every Wi-Fi client. no-hosts only changes what dnsmasq answers
# OTHER devices asking it about names in /etc/hosts (localhost included,
# which the wildcard now also correctly catches, consistent with every
# other name) - it does not touch DHCP leasing, option 114, or the
# Pi's own local hostname resolution (glibc resolves the Pi's own
# hostname via /etc/hosts directly, never by querying this dnsmasq
# instance). Re-verified in an isolated, throwaway dnsmasq instance on a
# private port before this was ever applied to the live config -
# wildcard behavior for every other name (including the
# connectivitycheck.gstatic.com-style captive-portal DNS-hijack targets)
# confirmed unchanged.
no-hosts

# RFC 8910 / RFC 7710bis: DHCP option 114 advertises the Captive Portal API
# URL (RFC 8908) to clients that support it (Android 11+, some others).
# dnsmasq 2.91 has no built-in name for option 114, so it's set numerically;
# the quoted value is sent as a raw ASCII URI string per RFC 8910 encoding.
# Endpoint is served by nginx at /.well-known/captive-portal (see
# etc/nginx/sites-available/default). Legacy HTTP-probe-based detection
# (generate_204, hotspot-detect.html, ncsi.txt, etc.) is left in place
# unchanged for clients that don't support the Capport API.
dhcp-option=114,"http://10.0.0.1/.well-known/captive-portal"
