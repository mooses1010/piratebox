# A sample configuration for dhcpcd.
# See dhcpcd.conf(5) for details.

# Allow users of this group to interact with dhcpcd via the control socket.
#controlgroup wheel

# Inform the DHCP server of our hostname for DDNS.
hostname

# Use the hardware address of the interface for the Client ID.
#clientid
# or
# Use the same DUID + IAID as set in DHCPv6 for DHCPv4 ClientID as per RFC4361.
# Some non-RFC compliant DHCP servers do not reply with this set.
# In this case, comment out duid and enable clientid above.
duid

# Persist interface configuration when dhcpcd exits.
persistent

# vendorclassid is set to blank to avoid sending the default of
# dhcpcd-<version>:<os>:<machine>:<platform>
vendorclassid

# A list of options to request from the DHCP server.
option domain_name_servers, domain_name, domain_search
option classless_static_routes
# Respect the network MTU. This is applied to DHCP routes.
option interface_mtu

# Request a hostname from the network
option host_name

# Most distributions have NTP support.
option ntp_servers

# A ServerID is required by RFC2131.
require dhcp_server_identifier

# Generate SLAAC address using the Hardware Address of the interface
#slaac hwaddr
# OR generate Stable Private IPv6 Addresses based from the DUID
slaac private
denyinterfaces eth0

# Host/management DNS isolation fix (2026-09-03 incident - see
# docs/OPERATIONAL-DECISIONS.md "Host/Management DNS Isolation Fix").
# `denyinterfaces eth0` above already keeps dhcpcd from managing eth0
# itself (NetworkManager owns it - see etc/NetworkManager/conf.d/
# 98-piratebox-dns-ownership.conf), but dhcpcd's `resolv.conf` hook is
# GLOBAL, not per-interface: every dhcpcd event (a restart, a lease
# renewal, pb-ap's interface coming up/down) rebuilds /etc/resolv.conf
# from whatever DNS info dhcpcd itself knows about - which, on this box,
# is nothing (eth0 is denied to it, and pb-ap's static block below is
# the AP's own address, not a DNS source). Confirmed live: this
# unconditionally overwrote NetworkManager's real eth0-learned
# nameservers with an empty file (dhcpcd's own header comments, zero
# `nameserver` lines) - which then made glibc's resolver fall back to
# querying 127.0.0.1, where dnsmasq's captive wildcard answered instead
# (see except-interface=lo in etc/dnsmasq.conf for that other half).
# `nohook resolv.conf` stops dhcpcd from touching /etc/resolv.conf at
# all, permanently - NetworkManager is the sole owner going forward, for
# any interface it manages, deterministically (rc-manager=file, in the
# same NetworkManager conf.d file referenced above).
nohook resolv.conf

# PirateBox visitor AP static IP - moved from wlan0 to pb-ap during the
# ALFA Migration Round (2026-09-03). docs/EXTERNAL-AP-ARCHITECTURE-
# DESIGN.md originally planned to leave this block on wlan0 unchanged,
# on the assumption wlan0 would stay "up and idle, not retired" after
# migration - confirmed WRONG live: stopping hostapd's wlan0 binding
# took the interface fully down (no consumer keeps it up), so nothing
# held 10.0.0.1 any more, while pb-ap - with no static block of its
# own - fell through to dhcpcd's default per-interface DHCP-client/
# IPv4LL behavior and self-assigned a useless 169.254.x.x address
# instead. nginx (listen 80 default_server, no bound IP) was never the
# problem; nothing on this Pi held the address at all. See
# docs/OPERATIONAL-DECISIONS.md "ALFA Migration Round" for the full
# evidence chain (curl timeout, dnsmasq's own "interface pb-ap does not
# currently exist" warning at its moment of starting, dhcpcd's IPv4LL
# fallback log lines).
#
# wlan0 deliberately gets no static block here any more - per
# instruction it stays reserved/available for future use, not
# repurposed, and an unmanaged down interface needs no dhcpcd entry.
# If wlan0 is ever deliberately repurposed later, this should be
# revisited then, not assumed either way now.
interface pb-ap
static ip_address=10.0.0.1/24
nohook wpa_supplicant
