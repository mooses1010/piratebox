# PirateBox: make NetworkManager's ownership of /etc/resolv.conf
# explicit and deterministic.
#
# Added 2026-09-03 as part of the Host/Management DNS Isolation Fix -
# see docs/OPERATIONAL-DECISIONS.md "Host/Management DNS Isolation Fix"
# for the full incident. The Pi's own hostname resolution (Claude Code's
# API calls included) briefly resolved public hostnames to 10.0.0.1,
# PirateBox's visitor-side captive wildcard address, because
# /etc/resolv.conf ended up empty - dhcpcd's global `resolv.conf` hook
# was unconditionally overwriting NetworkManager's real eth0-learned
# nameservers with nothing (see etc/dhcpcd.conf's `nohook resolv.conf`,
# the other half of this fix).
#
# Without an explicit `rc-manager` here, NetworkManager auto-detects how
# to write /etc/resolv.conf (resolvconf, if installed; systemd-resolved,
# if active; a plain file, otherwise) - which is exactly the kind of
# implicit, environment-dependent ownership that let a second manager
# (dhcpcd) collide with it unnoticed. `rc-manager=file` pins
# NetworkManager to writing /etc/resolv.conf directly, always, so this
# box's actual behavior does not silently change if `resolvconf` or
# `systemd-resolved` are ever installed/enabled later for an unrelated
# reason.
#
# This only governs interfaces NetworkManager actually manages - eth0
# (management/optional WAN), per this project's architecture. wlan0 and
# pb-ap stay excluded via 99-piratebox.conf in this same directory;
# nothing here changes that.
[main]
rc-manager=file
