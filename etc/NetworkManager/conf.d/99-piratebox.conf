# PirateBox: interfaces NetworkManager must never touch.
#
# PROVENANCE NOTE: this file already exists live at
# /etc/NetworkManager/conf.d/99-piratebox.conf and has been in effect
# throughout this project's history - it was found live-only and
# UNTRACKED during the AWUS036ACM Hardware Validation Round (2026-09-03)
# and is being brought into version control here for the first time.
# The live file currently has only the wlan0 line below; the pb-ap line
# is new (staged) and not yet live - see
# docs/EXTERNAL-AP-ARCHITECTURE-DESIGN.md "NetworkManager ownership".
#
# wlan0: the current production PirateBox AP radio. hostapd/dnsmasq own
# it directly; NetworkManager must never auto-connect or otherwise
# manage it, or it would fight hostapd for the interface.
#
# pb-ap: the external AWUS036ACM's stable name (see
# etc/udev/rules.d/99-piratebox-external-ap.rules), staged for when a
# future migration makes it the visitor AP radio. Excluding it now,
# before that migration, is deliberately conservative: the Hardware
# Validation Round found NetworkManager already lists a freshly-plugged
# ALFA as a managed device (state "unavailable", no active connection)
# and was only prevented from touching it by NetworkManager's own wifi
# radio switch happening to be globally off at the time
# (`nmcli radio wifi` = disabled) - not a guarantee. Listing pb-ap here
# ahead of time means the exclusion is already in place by the time any
# future migration step re-enables that radio switch (which a
# regulatory-domain fix via `raspi-config nonint do_wifi_country` would
# also do as a side effect - see the same design doc's "Regulatory
# domain" section) - no new exposure window is created.
#
# If onboard wlan0 is later repurposed away from being an AP (e.g. for
# management/scanning after a migration), this line's continued
# presence should be revisited deliberately at that time - not assumed
# either way.
[keyfile]
unmanaged-devices=interface-name:wlan0;interface-name:pb-ap
