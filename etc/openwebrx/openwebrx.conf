# PirateBox: OpenWebRX+ bootstrap configuration.
#
# This is the top-level INI file OpenWebRX+ itself looks for at
# /etc/openwebrx/openwebrx.conf (owrx/config/core.py's
# CoreConfig.defaultSearchLocations) - it only sets the handful of
# settings needed before the application can find its real (JSON-based)
# configuration store; everything else (SDR devices, profiles, gain,
# receiver name, etc.) lives under data_directory below, seeded once by
# tools/install_openwebrx.sh via the documented `openwebrx config
# migrate` path (see etc/openwebrx/sdrs_seed.py) and from then on
# normally edited through OpenWebRX+'s own /settings web UI (its own
# config storage explicitly says it "is not intended to be edited
# manually" past this point - see that file's own comment).
#
# bind_address: 127.0.0.1 only - OpenWebRX+ is never directly reachable
# from pb-ap clients or the wider network; nginx is the only path in,
# reverse-proxying /radio/ to this loopback address (see
# etc/nginx/openwebrx-location.conf). This is the same "backend on
# loopback, nginx as the only public entry point" pattern the project's
# own architecture doc (docs/RADIO-SDR-ARCHITECTURE-DESIGN.md section
# 10) called for before any of this was built.
[core]
data_directory = /var/lib/openwebrx
temporary_directory = /tmp

[web]
port = 8073
bind_address = 127.0.0.1
# IPv6 is irrelevant on this project's isolated 10.0.0.0/24 visitor
# network and this Pi has no need for it here - disabled to keep the
# listening socket set minimal and easy to reason about.
ipv6 = false
