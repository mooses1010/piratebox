# Incident 2026-09-05: the ALFA (MT7612U) disconnected and re-enumerated at
# 12:15 PDT. udev correctly renamed the newly-created interface back to
# "pb-ap" (etc/udev/rules.d/99-piratebox-external-ap.rules), but hostapd
# itself - a long-lived process that had already been running since before
# the disconnect - never noticed: the nl80211 wiphy/interface it was
# actually bound to was gone, but the hostapd PROCESS never exited
# (confirmed live: NRestarts=0, same PID throughout, hostapd's own journal
# completely silent from before the disconnect until manually restarted
# hours later). Restart=always (below, in [Service]) never had anything to
# react to, because nothing about this failure ever caused hostapd to
# exit. The AP stayed down - confirmed absent from real client devices -
# for hours, while every "is hostapd healthy" check that only asks systemd
# for the service's ActiveState (including this project's own
# /run/piratebox/status.json) reported healthy the entire time, since the
# process itself never stopped. See docs/OPERATIONAL-DECISIONS.md's dated
# entry for the full incident evidence and root-cause analysis.
#
# Fix: bind hostapd's own lifecycle to the SPECIFIC pb-ap network
# interface's systemd device unit, so hostapd is stopped (cleanly, once)
# the moment that specific interface disappears, rather than being left
# running blind against a wiphy that no longer exists. Pairs with a
# matching udev rule change (ENV{SYSTEMD_WANTS}+="hostapd.service") that
# explicitly (re)starts hostapd the moment udev finishes recreating and
# renaming the interface - so recovery is driven by the actual add/remove
# events, not a polling loop.
#
# CORRECTION (2026-09-05, same incident, caught during live verification):
# BindsTo=/After=/Condition*= are [Unit] section directives, not [Service]
# ones. The first version of this fix put all three under [Service] below
# - systemd silently accepted the file (no parse error) but logged "Unknown
# key 'BindsTo' in section [Service], ignoring" for all three at every
# hostapd start, meaning the fix was a complete no-op from the moment it
# was written until this was caught by explicitly checking hostapd's own
# journal after a live redeploy, exactly the kind of "does this actually
# do what the file claims" verification this project's own conventions
# call for. Moved to their correct section here.
[Unit]
BindsTo=sys-subsystem-net-devices-pb\x2dap.device
After=sys-subsystem-net-devices-pb\x2dap.device
# ConditionPathExists guards the interaction between BindsTo (above) and
# Restart=always ([Service], below): without this, once BindsTo stops
# hostapd because pb-ap disappeared, Restart=always would immediately try
# to restart it every RestartSec (2s) while the interface is still absent
# - each attempt would fail immediately (hostapd.conf names an interface
# that doesn't exist), and after the base unit's inherited
# StartLimitBurst=5 failures within StartLimitIntervalUSec=10s the unit
# would land in "failed" and stop retrying on its own, even once the
# interface actually came back. A failed Condition= check is NOT counted
# as a start failure by systemd, so this keeps hostapd harmlessly idle
# (checking a path, not spawning a process) while pb-ap is absent, and
# never exhausts the restart-burst budget - avoiding exactly the kind of
# restart-loop/thrashing this fix must not introduce.
ConditionPathExists=/sys/class/net/pb-ap

[Service]
ExecStartPre=/usr/sbin/rfkill unblock wifi
# Phase 2: the base hostapd.service unit only sets Restart=on-failure, which
# does NOT retry a clean (exit-code-0) shutdown. Live testing on 2026-08-31
# showed that a hard kill of hostapd can leave wlan0 in a state that briefly
# loses carrier; hostapd then exits cleanly (by design - it can't run an AP
# without carrier), and on-failure correctly does not restart a clean exit,
# leaving the AP down until manually restarted. Restart=always closes that
# gap: hostapd restarts on ANY exit, while the base unit's inherited
# StartLimitBurst=5 / StartLimitIntervalUSec=10s (not overridden here) still
# stops a genuine restart loop after 5 attempts in 10 seconds.
Restart=always
