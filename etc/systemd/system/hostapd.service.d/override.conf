[Service]
ExecStartPre=/usr/sbin/rfkill unblock wifi
# Phase 2: the base hostapd.service unit only sets Restart=on-failure, which
# does NOT retry a clean (exit-code-0) shutdown. Live testing on 2026-08-31
# showed that a hard kill of hostapd can leave wlan0 in a state that briefly
# loses carrier; hostapd then exits cleanly (by design - it can't run an AP
# without carrier), and on-failure correctly does not restart a clean exit,
# leaving the AP down until manually restarted. Restart=always closes that
# gap: hostapd restarts on ANY exit, while the base unit's inherited
# StartLimitBurst=5 / StartLimitIntervalUSec=10s (not overridden here) still
# stops a genuine restart loop after 5 attempts in 10 seconds.
Restart=always
